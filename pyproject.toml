[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelloop"
version = "0.1.0"
description = "SentinelLoop: decision-audited, drift-gated prognostics loop for NASA C-MAPSS (TELIPORT Season 4, Case Study 1)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<1.8",
  "scipy>=1.11,<2",
  "mlflow>=3.0,<3.1",
  "sqlalchemy>=2.0,<2.1",
  "streamlit>=1.38,<2",
  "plotly>=5.18,<6",
  "pyyaml>=6",
  "matplotlib>=3.8,<4",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
markers = ["slow: integration tests on real C-MAPSS files"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
